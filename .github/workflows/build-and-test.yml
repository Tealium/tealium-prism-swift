name: Build and Test

on: [pull_request]

permissions:
  contents: read

env:
  BUNDLE_WITHOUT: docs
  FASTLANE_SKIP_UPDATE_CHECK: "1"
  FASTLANE_HIDE_CHANGELOG: "1"
  FASTLANE_OPT_OUT_USAGE: "1"
  # fastlane scan (scripts/run_tests.sh) reads this as its xcargs option; set here so local runs are unchanged.
  # The index store is only used by the Xcode editor.
  SCAN_XCARGS: COMPILER_INDEX_STORE_ENABLE=NO

# PR jobs only restore the gems cache; gems-cache-seed.yml on dev writes the entry PRs restore.
# Quirk: ruby/setup-ruby (v1.335.0) bundles @actions/cache 5.0.3, which ignores cache-mode
# and has no restore-only input, so on a cache miss it still builds the archive (~0.4 s) and
# then logs a refused save (no failure). Goes away once setup-ruby ships @actions/cache >= 5.2.0.
cache-mode: read

jobs:
  build_example:
    name: Example Builds | ${{ matrix.scheme }}
    runs-on: macos-15
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - scheme: Example_iOS
            destination: "generic/platform=iOS Simulator"
          - scheme: Example_tvOS
            destination: "generic/platform=tvOS Simulator"
          - scheme: Example_macOS
            destination: "generic/platform=macOS"
            xcargs: "CODE_SIGN_IDENTITY='' CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO"
          - scheme: "Example_watchOS Watch App"
            destination: "generic/platform=watchOS Simulator"
    steps:
      - uses: actions/checkout@v7
      - name: "Run Local Action: Setup Machine"
        uses: ./.github/workflows/setup-machine
      - name: Build - "${{ matrix.scheme }}"
        working-directory: Example
        # Same flag as SCAN_XCARGS above, passed to xcodebuild through build.sh.
        run: |
          ../scripts/build.sh --scheme "${{ matrix.scheme }}" --destination "${{ matrix.destination }}" \
            --xcargs "COMPILER_INDEX_STORE_ENABLE=NO ${{ matrix.xcargs }}"
  build_SPM:
    name: SPM Builds | ${{ matrix.destination }}
    runs-on: macos-15
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        destination:
            - "generic/platform=iOS"
            - "generic/platform=iOS Simulator"
            - "generic/platform=tvOS"
            - "generic/platform=tvOS Simulator"
            - "generic/platform=macOS"
            - "generic/platform=watchOS"
            - "generic/platform=watchOS Simulator"
    steps:
      - uses: actions/checkout@v7
      - name: "Run Local Action: Setup Xcode"
        uses: ./.github/workflows/setup-xcode
      - name: Build - TealiumPrism-Package
        run: scripts/build_spm.sh "${{ matrix.destination }}"
  test_iOS:
    name: iOS Tests | ${{ matrix.scheme }}
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      matrix:
        scheme:
            - CoreTests_iOS
            - DelegateProxyTests_iOS
            - LifecycleTests_iOS
            - ExtensionsTests_iOS
            - JavaScriptTransformerTests_iOS
            - EndToEndTests_iOS
            - ContextAPITests_iOS
        destination:
            - "platform=iOS Simulator,OS=18.5,name=iPhone 16 Pro"
    steps:
      - uses: actions/checkout@v7
      - name: "Run Local Action: Setup Machine"
        uses: ./.github/workflows/setup-machine
      - name: Test - "${{ matrix.scheme }}"
        run: scripts/run_tests.sh --scheme "${{ matrix.scheme }}" --destination "${{ matrix.destination }}"
      - name: Diagnostics on failure or cancel
        if: failure() || cancelled()
        run: |
          xcode-select -p && xcodebuild -version
          xcrun simctl list runtimes
          xcrun simctl list devices available
  test_tvOS:
    name: tvOS Tests | ${{ matrix.scheme }}
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      matrix:
        scheme:
            - CoreTests_tvOS
            - EndToEndTests_tvOS
            - LifecycleTests_tvOS
            - ContextAPITests_tvOS
            - ExtensionsTests_tvOS
            - JavaScriptTransformerTests_tvOS
        destination:
            - "platform=tvOS Simulator,OS=18.5,name=Apple TV"
    steps:
      - uses: actions/checkout@v7
      - name: "Run Local Action: Setup Machine"
        uses: ./.github/workflows/setup-machine
      - name: Test - "${{ matrix.scheme }}"
        run: scripts/run_tests.sh --scheme "${{ matrix.scheme }}" --destination "${{ matrix.destination }}"
      - name: Diagnostics on failure or cancel
        if: failure() || cancelled()
        run: |
          xcode-select -p && xcodebuild -version
          xcrun simctl list runtimes
          xcrun simctl list devices available
  test_macOS:
    name: macOS Tests | ${{ matrix.scheme }}
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      matrix:
        scheme:
            - CoreTests_macOS
            - EndToEndTests_macOS
            - LifecycleTests_macOS
            - ContextAPITests_macOS
            - ExtensionsTests_macOS
            - JavaScriptTransformerTests_macOS
        destination:
            - "platform=macOS"
    steps:
      - uses: actions/checkout@v7
      - name: "Run Local Action: Setup Machine"
        uses: ./.github/workflows/setup-machine
      - name: Test - "${{ matrix.scheme }}"
        run: scripts/run_tests.sh --scheme "${{ matrix.scheme }}" --destination "${{ matrix.destination }}"
      - name: Diagnostics on failure or cancel
        if: failure() || cancelled()
        run: |
          xcode-select -p && xcodebuild -version
          xcrun simctl list runtimes
          xcrun simctl list devices available
  test_watchOS:
    name: watchOS Tests | ${{ matrix.scheme }}
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      matrix:
        scheme:
            - CoreTests_watchOS
            - EndToEndTests_watchOS
            - LifecycleTests_watchOS
            - ContextAPITests_watchOS
            - ExtensionsTests_watchOS
        destination:
            - "platform=watchOS Simulator,name=Apple Watch Series 10 (42mm)"
    steps:
      - uses: actions/checkout@v7
      - name: "Run Local Action: Setup Machine"
        uses: ./.github/workflows/setup-machine
      - name: Test - "${{ matrix.scheme }}"
        run: scripts/run_tests.sh --scheme "${{ matrix.scheme }}" --destination "${{ matrix.destination }}"
      - name: Diagnostics on failure or cancel
        if: failure() || cancelled()
        run: |
          xcode-select -p && xcodebuild -version
          xcrun simctl list runtimes
          xcrun simctl list devices available
